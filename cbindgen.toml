# cbindgen configuration for NIH-Plug AUv3 FFI
# This file configures cbindgen to generate C headers from the Rust FFI code

language = "C"
header = "/* Generated by cbindgen. Do not edit. */"
include_version = true
namespace = "NIHPlugAUv3"
include_guard = "NIH_PLUG_AUV3_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
cpp_compat = true
style = "type"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"

[export]
include = ["FFIError", "ParameterInfo", "PluginHandle"]
exclude = ["PluginWrapper", "DummyParams"]

[export.rename]
"FFIError" = "FFIError"
"ParameterInfo" = "ParameterInfo"
"PluginHandle" = "PluginHandle"

[parse]
parse_deps = true
include = ["nih-plug"]
exclude = ["nih-plug-derive"]

[parse.expand]
crates = ["nih-plug"]